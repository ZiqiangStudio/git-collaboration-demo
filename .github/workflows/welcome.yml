name: Welcome Contributor

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    name: Post Welcome Comment
    runs-on: ubuntu-24.04
    steps:
      - name: Greet on Issue
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `👋 感谢提交 Issue！技术中心维护团队会尽快跟进处理。请确保问题复现步骤完备。`
            })

      - name: Greet on Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🎉 感谢发起 Pull Request！CI 门禁已自动触发，请等待静态检查与单元测试完成。相关 Reviewer 会尽快参与评审。`
            })
