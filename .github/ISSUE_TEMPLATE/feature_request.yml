name: 新功能需求 (Feature Request)
description: 为项目提出新的业务功能、架构改进或演进建议
title: "feat: "
labels: ["enhancement", "feature"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出新的功能构想！请清晰描述使用场景与预期价值。
  - type: textarea
    id: problem
    attributes:
      label: 解决的痛点或背景
      description: 当前遇到了什么不便，或者为什么需要这个新特性？
      placeholder: 当前计算器缺少幂运算支持...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的实现方案
      description: 你构想的具体实现逻辑或接口设计。
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 需求优先级
      options:
        - 探索性建议 (Nice to have)
        - 近期迭代规划 (Planned)
        - 核心演进依赖 (High Priority)
    validations:
      required: true
